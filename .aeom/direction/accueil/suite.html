<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Préréglage du salon — Petit Bac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Shantell+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="p-suite">

<!-- l'accueil reste derrière, assombri : la feuille monte par-dessus, depuis « Changer » dans la tuile Créer un salon -->
<iframe class="fond" src="index.html" title="Accueil, derrière la feuille" tabindex="-1" aria-hidden="true" inert></iframe>
<div class="voile" aria-hidden="true"></div>

<form class="sheet" action="#" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
  <span class="sheet__grip" aria-hidden="true"></span>
  <div class="sheet__head">
    <p class="kick">Entre amis · Créer un salon</p>
    <a class="quit" href="index.html"><span aria-hidden="true">×</span> Fermer</a>
  </div>
  <h1 id="sheet-t" class="sheet__t"><span class="sheet__hl">Préréglage</span> du salon</h1>

  <fieldset class="presets">
    <legend class="sr">Préréglage du salon</legend>
    <label class="preset"><input type="radio" name="prereglage" value="express"><span class="preset__n">Express</span><span class="preset__d">4 catégories</span><span class="preset__d">45 s · 3 manches</span></label>
    <label class="preset"><input type="radio" name="prereglage" value="classique" checked><span class="preset__tag">par défaut</span><span class="preset__n">Classique</span><span class="preset__d">6 catégories</span><span class="preset__d">1 min 30 · 5 manches</span></label>
    <label class="preset"><input type="radio" name="prereglage" value="marathon"><span class="preset__n">Marathon</span><span class="preset__d">12 catégories</span><span class="preset__d">3 min · 10 manches</span></label>
  </fieldset>

  <button class="btn btn--wide" type="submit">Créer le salon <span aria-hidden="true">→</span></button>
</form>

</body>
</html>
